turn_off_house_tvs:
  alias: Turn Off House TVs
  description: >-
    Shared by "Alarm Away Actions" and "Alarm Home Actions".
  sequence:
    - if:
        - condition: state
          entity_id: media_player.living_room_tv
          state:
            - 'on'
      then:
        - action: media_player.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: media_player.living_room_tv
      alias: If the living room TV is on, turn it off
    - if:
        - condition: state
          entity_id: media_player.basement_tv
          state:
            - 'on'
      then:
        - action: media_player.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: media_player.basement_tv
      alias: If the basement TV is on, turn it off
  mode: single
house_lights_off:
  alias: Turn Off Common House Lights
  description: >-
    Switches and lights common to "Alarm Away Actions" and "Alarm Home
    Actions" -- Home Actions also turns off switch.deck_lights, which
    Away doesn't, handled separately in that automation.
  sequence:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id:
          - switch.christmas_tree_switch_3
          - switch.living_room_air_purifier_outlet
          - switch.living_room_side_lights_outlet
    - action: light.turn_off
      metadata: {}
      data: {}
      target:
        entity_id:
          - light.kitchen_cabinet_lights
          - light.living_room_lights
          - light.basement_bathroom_light_switch
          - light.basement_entertainment_area_light_switch
          - light.basement_stairs_light_switch
          - light.gym_light_switch
          - light.mechanical_room_light_switch
          - light.pool_table_light_switch
          - light.pool_table_area_light_switch
          - light.guest_bedroom_light_switch
  mode: single
