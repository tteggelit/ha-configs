secure_front_door:
  alias: Secure Front Door
  description: >-
    If the front door is open, notify immediately. Otherwise, if it's
    unlocked, lock it and notify if it's still unlocked 30 seconds
    later. Shared by "Alarm Away Actions" and "Alarm Home Actions".
  sequence:
    - if:
        - condition: state
          entity_id: binary_sensor.front_door_sensor
          state: 'on'
      then:
        - metadata: {}
          data:
            message: Front door is open!
            data:
              push:
                sound:
                  name: default
                  critical: 1
                  volume: 1
          action: notify.mobile_app_tis_iphone
        - metadata: {}
          data:
            message: Front door is open!
            data:
              push:
                sound:
                  name: default
                  critical: 1
                  volume: 1
          action: notify.mobile_app_amys_iphone
      else:
        - if:
            - condition: state
              entity_id: lock.front_door_lock
              state:
                - unlocked
          then:
            - metadata: {}
              data: {}
              target:
                entity_id: lock.front_door_lock
              action: lock.lock
            - delay:
                hours: 0
                minutes: 0
                seconds: 30
                milliseconds: 0
              alias: Wait 30 seconds
            - if:
                - condition: state
                  entity_id: lock.front_door_lock
                  state:
                    - unlocked
              then:
                - metadata: {}
                  data:
                    message: Front door unlocked!
                    data:
                      push:
                        sound:
                          name: default
                          critical: 1
                          volume: 1
                  action: notify.mobile_app_tis_iphone
                - metadata: {}
                  data:
                    message: Front door unlocked!
                    data:
                      push:
                        sound:
                          name: default
                          critical: 1
                          volume: 1
                  action: notify.mobile_app_amys_iphone
  mode: single
secure_garage:
  alias: Secure Garage
  description: >-
    If the garage door is open, attempt to close it; notify if it's
    still open a minute later. Shared by "Alarm Away Actions" and
    "Alarm Home Actions".
  sequence:
    - if:
        - condition: state
          entity_id: cover.garage_door
          state: open
      then:
        - metadata: {}
          data: {}
          target:
            entity_id: cover.garage_door
          action: cover.close_cover
        - delay:
            hours: 0
            minutes: 1
            seconds: 0
            milliseconds: 0
        - if:
            - condition: state
              entity_id: cover.garage_door
              state: open
          then:
            - metadata: {}
              data:
                message: Garage door is open!
                data:
                  push:
                    sound:
                      name: default
                      critical: 1
                      volume: 1
              action: notify.mobile_app_tis_iphone
            - metadata: {}
              data:
                message: Garage door is open!
                data:
                  push:
                    sound:
                      name: default
                      critical: 1
                      volume: 1
              action: notify.mobile_app_amys_iphone
  mode: single
