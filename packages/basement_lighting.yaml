input_number:
  pool_table_area_lights_previous_value:
    name: Pool Table Area Lights Previous Value
    min: 0
    max: 100
    initial: 100

script:
  dim_basement_entertainment_lights_for_watching_tv:
    sequence:
      # Step 1: Sequential commands with delays (prevents race conditions)
      - action: light.turn_on
        data:
          brightness_pct: 15
          transition: 4
        target:
          entity_id:
            - light.basement_entertainment_light_3
      
      - action: light.turn_on
        data:
          brightness_pct: 40
          transition: 4
        target:
          entity_id:
            - light.basement_entertainment_light_4
      
      #- delay: 0.5  # Give Zigbee mesh time to process
      
      - action: light.turn_on
        data:
          brightness_pct: 35
          transition: 4
        target:
          entity_id:
            - light.basement_entertainment_light_1
            - light.basement_entertainment_light_2
      
      # Step 2: Wait for transitions to complete
      - delay: 5
      
      # Step 3: Verify and retry only failed lights
      - choose:
          - conditions:
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity_id: light.basement_entertainment_light_1
                    attribute: brightness
                    above: 30
                  - condition: numeric_state
                    entity_id: light.basement_entertainment_light_3
                    attribute: brightness
                    above: 30
                  - condition: numeric_state
                    entity_id: light.basement_entertainment_light_2
                    attribute: brightness
                    above: 10
                  - condition: numeric_state
                    entity_id: light.basement_entertainment_light_4
                    attribute: brightness
                    above: 10
            sequence:
              # Retry lights that didn't reach target (shorter transition for retry)
              - action: light.turn_on
                data:
                  brightness_pct: 25
                  transition: 2
                target:
                  entity_id: >
                    {% set failed = [] %}
                    {% for light in ['light.basement_entertainment_light_3', 'light.basement_entertainment_light_4'] %}
                      {% if state_attr(light, 'brightness') | int > 30 %}
                        {% set failed = failed + [light] %}
                      {% endif %}
                    {% endfor %}
                    {{ failed if failed else [] }}
              - action: light.turn_on
                data:
                  brightness_pct: 5
                  transition: 2
                target:
                  entity_id: >
                    {% set failed = [] %}
                    {% for light in ['light.basement_entertainment_light_1', 'light.basement_entertainment_light_2'] %}
                      {% if state_attr(light, 'brightness') | int > 10 %}
                        {% set failed = failed + [light] %}
                      {% endif %}
                    {% endfor %}
                    {{ failed if failed else [] }}
    alias: Dim Basement Entertainment lights for watching TV
    description: ''

  reset_basement_entertainment_lights:
    sequence:
    - parallel:
      - action: light.turn_on
        target:
          entity_id: light.basement_entertainment_area_light_switch
        data:
          transition: 4
          brightness_pct: 66
      - action: light.turn_on
        target:
          entity_id:
          - light.basement_entertainment_light_1
          - light.basement_entertainment_light_2
          - light.basement_entertainment_light_3
          - light.basement_entertainment_light_4
        data:
          brightness_pct: 100
          transition: 4
    alias: Reset Basement Entertainment lights
    description: ''

switch:
  - platform: flux
    lights:
      - light.basement_entertainment_light_1
      - light.basement_entertainment_light_2
      - light.basement_entertainment_light_3
      - light.basement_entertainment_light_4
    name: Basement Entertainment Flux
    start_time: "6:00"
    stop_time: "20:00"
    start_colortemp: 6500
    sunset_colortemp: 3200
    stop_colortemp: 2000
    brightness: 255
    disable_brightness_adjust: true
    mode: mired
    transition: 30
    interval: 60

automation:
  - id: 'turn_on_basement_stairs_lights_after_motion'
    alias: Turn on Basement Stairs lights after motion
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.basement_stairs_motion_sensor_occupancy
        to:
          - 'on'
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: media_player.plex_plex_for_samsung_tv_2025
            state:
              - playing
    actions:
      - action: light.turn_on
        target:
          entity_id: light.basement_stairs_light_switch
        data:
          brightness_pct: 100
          transition: 1
    mode: single
  - id: 'dim_basement_stairs_lights_after_no_motion'
    alias: Dim Basement Stairs lights after no motion
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.basement_stairs_motion_sensor_occupancy
        to:
          - 'off'
        for:
          hours: 0
          minutes: 0
          seconds: 15
    conditions:
      - condition: state
        entity_id: light.basement_stairs_light_switch
        state:
          - 'on'
    actions:
      - action: light.turn_on
        target:
          entity_id: light.basement_stairs_light_switch
        data:
          brightness_pct: 10
          transition: 2
    mode: single
  - id: 'turn_off_basement_stairs_lights_after_no_motion'
    alias: Turn off Basement Stairs lights after no motion
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.basement_stairs_motion_sensor_occupancy
        to:
          - 'off'
        for:
          hours: 0
          minutes: 1
          seconds: 30
      - trigger: state
        entity_id:
          - media_player.plex_plex_for_samsung_tv_2025
        to:
          - playing
    actions:
      - action: light.turn_off
        target:
          entity_id: light.basement_stairs_light_switch
        data:
          transition: 3
    mode: single
  - id: 'dim_mechanical_room_lights_after_no_motion'
    alias: Dim Mechanical Room lights after no motion
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.mechanical_room_motion_sensor_occupancy
        to:
          - 'off'
        for:
          hours: 0
          minutes: 5
          seconds: 0
    actions:
      - action: light.turn_on
        target:
          entity_id: light.mechanical_room_light_switch
        data:
          transition: 5
          brightness_pct: 15
    mode: single
  - id: 'turn_on_mechanical_room_lights_after_motion'
    alias: Turn on Mechanical Room lights after motion
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.mechanical_room_motion_sensor_occupancy
        to:
          - 'on'
    actions:
      - action: light.turn_on
        target:
          entity_id: light.mechanical_room_light_switch
        data:
          brightness_pct: 100
          transition: 2
    mode: single
  - id: 'turn_off_mechanical_room_lights_after_no_motion'
    alias: Turn off Mechanical Room lights after no motion
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.mechanical_room_motion_sensor_occupancy
        to:
          - 'off'
        for:
          hours: 0
          minutes: 7
          seconds: 0
    actions:
      - action: light.turn_off
        target:
          entity_id: light.mechanical_room_light_switch
        data:
          transition: 2
    mode: single
  - id: 'turn_off_basement_entertainment_area_lights'
    alias: Turn off Basement Entertainment Area lights
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - light.basement_entertainment_area_light_switch
        to:
          - 'off'
        for:
          hours: 0
          minutes: 1
          seconds: 0
    actions:
      - action: light.turn_off
        target:
          entity_id:
            - light.basement_entertainment_light_1
            - light.basement_entertainment_light_2
            - light.basement_entertainment_light_3
            - light.basement_entertainment_light_4
    mode: single
  - id: 'dim_entertainment_area_lights_when_tv_turns_on'
    alias: Dim Entertainment Area Lights when TV turns on
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - media_player.basement_tv
        to:
          - 'on'
    conditions:
      - condition: state
        entity_id: light.basement_entertainment_area_light_switch
        state:
          - 'on'
    actions:
      - action: script.dim_basement_entertainment_lights_for_watching_tv
        metadata: {}
        data: {}
    mode: single
  - id: 'dim_entertainment_area_lights_if_the_tv_is_on'
    alias: Dim Entertainment Area Lights if the TV is on
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - light.basement_entertainment_area_light_switch
        to:
          - 'on'
    conditions:
      - condition: state
        entity_id: media_player.basement_tv
        state:
          - 'on'
    actions:
      - action: script.dim_basement_entertainment_lights_for_watching_tv
        metadata: {}
        data: {}
    mode: single
  - id: 'reset_basement_entertainment_area_lights_brightness'
    alias: Reset Basement Entertainment Area Lights brightness
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - media_player.basement_tv
        to:
          - 'off'
    conditions:
      - condition: state
        entity_id: light.basement_entertainment_area_light_switch
        state:
          - 'on'
    actions:
      - action: script.reset_basement_entertainment_lights
        metadata: {}
        data: {}
    mode: single
  - id: 'reset_basement_entertainment_area_lights_brightness_if_tv_is_off'
    alias: Reset Basement Entertainment Area Lights brightness if TV is off
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - light.basement_entertainment_area_light_switch
        to:
          - 'on'
    conditions:
      - condition: state
        entity_id: media_player.basement_tv
        state:
          - 'off'
    actions:
      - action: script.reset_basement_entertainment_lights
        metadata: {}
        data: {}
    mode: single
  - id: 'change_basement_entertainment_area_lights_temperature'
    alias: Change Basement Entertainment Area lights temperature
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - light.pool_table_light_switch
        to:
          - 'on'
    conditions:
      - condition: state
        entity_id: light.basement_entertainment_area_light_switch
        state:
          - 'on'
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.basement_entertainment_flux
      - action: light.turn_on
        target:
          entity_id:
            - light.basement_entertainment_light_1
            - light.basement_entertainment_light_2
            - light.basement_entertainment_light_3
            - light.basement_entertainment_light_4
        data:
          color_temp_kelvin: 3500
          transition: 60
    mode: single
  - id: 'reset_basement_entertainment_area_flux'
    alias: Reset Basement Entertainment Area Flux
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - light.pool_table_light_switch
        to:
          - 'off'
    conditions:
      - condition: state
        entity_id: light.basement_entertainment_area_light_switch
        state:
          - 'on'
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.basement_entertainment_flux
    mode: single
  - id: 'set_basement_entertainment_flux'
    alias: Set Basement Entertainment Flux
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - light.basement_entertainment_area_light_switch
        to:
          - 'on'
    actions:
      - if:
        - condition: state
          entity_id: light.pool_table_light_switch
          state:
            - 'on'
        then:
          - action: switch.turn_off
            target:
              entity_id: switch.basement_entertainment_flux
          - action: light.turn_on
            target:
              entity_id:
                - light.basement_entertainment_light_1
                - light.basement_entertainment_light_2
                - light.basement_entertainment_light_3
                - light.basement_entertainment_light_4
            data:
              transition: 60
              color_temp_kelvin: 3500
        else:
          - action: switch.turn_on
            target:
              entity_id: switch.basement_entertainment_flux
    mode: single
  - id: 'dim_pool_table_area_lights_when_pool_table_light_turns_on'
    alias: Dim Pool Table Area lights when Pool Table light turns on
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - light.pool_table_light_switch
        to:
          - 'on'
    conditions:
      - condition: state
        entity_id: light.pool_table_area_light_switch
        state:
          - 'on'
    actions:
      - sequence:
        - action: input_number.set_value
          target:
            entity_id: input_number.pool_table_area_lights_previous_value
          data:
            value: >-
              {% if states('light.pool_table_area_light_switch') == 'off' %}
                0
              {% else %}
                {{ (state_attr('light.pool_table_area_light_switch', 'brightness') | int / 255 * 100) | round }}
              {% endif %}
        - action: light.turn_on
          target:
            entity_id: light.pool_table_area_light_switch
          data:
            transition: 4
            brightness_pct: 15
    mode: single
  - id: 'reset_pool_table_area_ligths'
    alias: Reset Pool Table Area lights
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - light.pool_table_light_switch
        to:
          - 'off'
    conditions:
      - condition: state
        entity_id: light.pool_table_area_light_switch
        state:
          - 'on'
    actions:
      - action: light.turn_on
        target:
          entity_id: light.pool_table_area_light_switch
        data:
          transition: 4
          brightness_pct: "{{ states('input_number.pool_table_area_lights_previous_value') }}"
    mode: single
  - id: 'dim_pool_table_area_lights_if_pool_table_light_is_on'
    alias: Dim Pool Table Area lights if Pool Table light is on
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - light.pool_table_area_light_switch
        to:
          - 'on'
    conditions:
      - condition: state
        entity_id: light.pool_table_light_switch
        state:
          - 'on'
    actions:
      - sequence:
        - action: input_number.set_value
          target:
            entity_id: input_number.pool_table_area_lights_previous_value
          data:
            value: >-
              {% if states('light.pool_table_area_light_switch') == 'off' %}
                0
              {% else %}
                {{ (state_attr('light.pool_table_area_light_switch', 'brightness') | int / 255 * 100) | round }}
              {% endif %}
        - action: light.turn_on
          target:
            entity_id: light.pool_table_area_light_switch
          data:
            transition: 4
            brightness_pct: 15
    mode: single
  - id: 'turn_on_basement_bathroom_lights_with_motion'
    alias: Turn on Basement Bathroom lights with motion
    description: ''
    triggers:
    - trigger: state
      entity_id:
      - binary_sensor.basement_bathroom_motion_sensor_occupancy
      to:
      - 'on'
    conditions: []
    actions:
    - action: light.turn_on
      metadata: {}
      target:
        entity_id: light.basement_bathroom_light_switch
      data:
        transition: 0
        brightness_pct: 52
    mode: single
  - id: 'dim_basement_bathroom_lights_when_no_motion'
    alias: Dim Basement Bathroom lights when no motion
    description: ''
    triggers:
    - trigger: state
      entity_id:
      - binary_sensor.basement_bathroom_motion_sensor_occupancy
      to:
      - 'off'
    conditions: []
    actions:
    - action: light.turn_on
      metadata: {}
      target:
        entity_id: light.basement_bathroom_light_switch
      data:
        transition: 5
        brightness_pct: 30
    mode: single
  - id: 'turn_off_basement_bathroom_lights_when_no_motion'
    alias: Turn off Basement Bathroom lights when no motion
    description: ''
    triggers:
    - trigger: state
      entity_id:
      - binary_sensor.basement_bathroom_motion_sensor_occupancy
      to:
      - 'off'
      for:
        hours: 0
        minutes: 0
        seconds: 30
    conditions: []
    actions:
    - action: light.turn_off
      metadata: {}
      target:
        entity_id: light.basement_bathroom_light_switch
      data:
        transition: 3
    mode: single
