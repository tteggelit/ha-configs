# This package consists of a script to cycle through RGB and White colors and
# an automation to process the button events.
# Here are how the button events are processed:
# Push Up           - Turn light on
# Push Down         - Turn lights off
# Hold Up           - Turn up the brightness to a max of 100%
# Hold Down         - Turn down the brightness to a min of 3%
# Push Right / Left - Cycle through RGB and White (warm, cool, bright, daylight) colors
#
# You will need to update the automation to reference the right device_id of the
# remote and what lights you want to control.
#
# To get the `device_id` of the remote (assuming ZHA), do the following:
# 1. Pair the remote as normal with ZHA
# 2. Once paired, go to Developer Tools and select Events
# 3. Listen for `zha_event` events
# 4. Push a button on the remote and you should see an event. Copy the `device_id`

# Scripts
script:
  cycle_aidans_nightstand_light_color:
    alias: Cycle Aidan's Nightstand Light Color
    mode: restart
    fields:
      entity_id:
        description: The light entity to control
        example: light.aidan_s_nightstand_light
      direction:
        description: Direction to cycle (forward or backward)
        example: forward
    sequence:
      - variables:
          current_hs: "{{ state_attr(entity_id, 'hs_color') }}"
          current_temp: "{{ state_attr(entity_id, 'color_temp') }}"
          current_mode: "{{ state_attr(entity_id, 'color_mode') }}"
          
          # Define color sequence with whites
          colors:
            - name: red
              hs: [0, 100]
            - name: orange
              hs: [30, 100]
            - name: yellow
              hs: [60, 100]
            - name: green
              hs: [120, 100]
            - name: cyan
              hs: [180, 100]
            - name: blue
              hs: [240, 100]
            - name: purple
              hs: [280, 100]
            - name: magenta
              hs: [320, 100]
            - name: warm_white
              color_temp_kelvin: 2700
            - name: cool_white
              color_temp_kelvin: 4000
            - name: bright_white
              color_temp_kelvin: 5000
            - name: daylight
              color_temp_kelvin: 6500
          
          # Find current index
          current_index: >
            {% if current_mode == 'color_temp' %}
              {% set temp_kelvin = state_attr(entity_id, 'color_temp_kelvin') | int(0) %}
              {% if temp_kelvin == 0 %}
                {% set temp_kelvin = (1000000 / (current_temp | int(370))) | int %}
              {% endif %}
              {% if temp_kelvin <= 3350 %}8
              {% elif temp_kelvin <= 4500 %}9
              {% elif temp_kelvin <= 5500 %}10
              {% else %}11
              {% endif %}
            {% elif current_hs %}
              {% set hue = current_hs[0] | int %}
              {% if hue < 15 %}0
              {% elif hue < 45 %}1
              {% elif hue < 90 %}2
              {% elif hue < 150 %}3
              {% elif hue < 210 %}4
              {% elif hue < 260 %}5
              {% elif hue < 300 %}6
              {% else %}7
              {% endif %}
            {% else %}0
            {% endif %}
          
          next_index: >
            {% if direction == 'forward' %}
              {{ (current_index | int + 1) % 12 }}
            {% else %}
              {{ (current_index | int - 1) % 12 }}
            {% endif %}
      
      - choose:
          # RGB colors (indices 0-7)
          - conditions:
              - condition: template
                value_template: "{{ next_index | int < 8 }}"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: "{{ entity_id }}"
                data:
                  hs_color: "{{ colors[next_index | int].hs }}"
          
          # White colors (indices 8-11)
          - conditions:
              - condition: template
                value_template: "{{ next_index | int >= 8 }}"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: "{{ entity_id }}"
                data:
                  color_temp_kelvin: "{{ colors[next_index | int].color_temp_kelvin }}"

# Automations
automation:
  - alias: Aidan's Nightstand Light Control
    description: Control RGB light with Styrbar remote
    mode: restart
    trigger:
      - platform: mqtt
        topic: "zigbee2mqtt/Aidan's Nightstand Light Remote/action"
        payload: "on"
        id: button_on
      - platform: mqtt
        topic: "zigbee2mqtt/Aidan's Nightstand Light Remote/action"
        payload: "off"
        id: button_off
      - platform: mqtt
        topic: "zigbee2mqtt/Aidan's Nightstand Light Remote/action"
        payload: "brightness_move_up"
        id: brightness_up
      - platform: mqtt
        topic: "zigbee2mqtt/Aidan's Nightstand Light Remote/action"
        payload: "brightness_move_down"
        id: brightness_down
      - platform: mqtt
        topic: "zigbee2mqtt/Aidan's Nightstand Light Remote/action"
        payload: "brightness_stop"
        id: brightness_stop
      - platform: mqtt
        topic: "zigbee2mqtt/Aidan's Nightstand Light Remote/action"
        payload: "arrow_left_click"
        id: color_left
      - platform: mqtt
        topic: "zigbee2mqtt/Aidan's Nightstand Light Remote/action"
        payload: "arrow_right_click"
        id: color_right
    action:
      - choose:
          # Turn on light
          - conditions:
              - condition: trigger
                id: button_on
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.aidan_s_nightstand_light
                data:
                  brightness_pct: 100
          
          # Turn off light
          - conditions:
              - condition: trigger
                id: button_off
            sequence:
              - service: light.turn_off
                target:
                  entity_id: light.aidan_s_nightstand_light
          
          # Brightness up (hold top button)
          - conditions:
              - condition: trigger
                id: brightness_up
            sequence:
              - repeat:
                  while:
                    - condition: template
                      value_template: >
                        {{ state_attr('light.aidan_s_nightstand_light', 'brightness') | int(0) < 255 }}
                  sequence:
                    - service: light.turn_on
                      target:
                        entity_id: light.aidan_s_nightstand_light
                      data:
                        brightness_step_pct: 10
                    - delay:
                        milliseconds: 200
          
          # Brightness down (hold bottom button)
          - conditions:
              - condition: trigger
                id: brightness_down
            sequence:
              - repeat:
                  while:
                    - condition: template
                      value_template: >
                        {{ state_attr('light.aidan_s_nightstand_light', 'brightness') | int(0) > 23 }}
                  sequence:
                    - service: light.turn_on
                      target:
                        entity_id: light.aidan_s_nightstand_light
                      data:
                        brightness_step_pct: -10
                    - delay:
                        milliseconds: 200
              - service: light.turn_on
                target:
                  entity_id: light.aidan_s_nightstand_light
                data:
                  brightness_pct: 3
          
          # Cycle color forward (right arrow)
          - conditions:
              - condition: trigger
                id: color_right
            sequence:
              - service: script.cycle_aidans_nightstand_light_color
                data:
                  entity_id: light.aidan_s_nightstand_light
                  direction: forward
          
          # Cycle color backward (left arrow)
          - conditions:
              - condition: trigger
                id: color_left
            sequence:
              - service: script.cycle_aidans_nightstand_light_color
                data:
                  entity_id: light.aidan_s_nightstand_light
                  direction: backward
