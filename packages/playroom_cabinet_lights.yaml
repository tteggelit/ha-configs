# This package binds Playroom Cabinet Lights Remote (an IKEA Bilresa) to
# the playroom cabinet lights. Shared brightness-ramp logic lives in
# packages/lighting_control.yaml -- see that file for what the script
# expects.
#
# Here are how the button events are processed:
# Push Up           - Turn light on
# Push Down         - Turn lights off
# Hold Up           - Turn up the brightness to a max of 100%
# Hold Down         - Turn down the brightness to a min of 3%
#
# To bind a new IKEA Bilresa remote: copy this file's trigger/choose
# structure (same MQTT payloads: "on"/"off"/"brightness_move_up"/
# "brightness_move_down"/"brightness_stop"), swap in the new remote's
# own MQTT topic ("zigbee2mqtt/<friendly name>/action" -- find the
# friendly name in the Z2M frontend after pairing) and its own
# target/reference light(s), and call the same shared script. Bilresa
# remotes have no color-cycle buttons, so there's no equivalent of the
# Styrbar files' arrow_left_click/arrow_right_click handling.

# Automations
automation:
  - alias: Playroom Cabinet Lights Control
    description: Control lights with IKEA Bilresa remote
    mode: restart
    triggers:
      - trigger: mqtt
        topic: "zigbee2mqtt/Playroom Cabinet Lights Remote/action"
        payload: "on"
        id: button_on
      - trigger: mqtt
        topic: "zigbee2mqtt/Playroom Cabinet Lights Remote/action"
        payload: "off"
        id: button_off
      - trigger: mqtt
        topic: "zigbee2mqtt/Playroom Cabinet Lights Remote/action"
        payload: "brightness_move_up"
        id: brightness_up
      - trigger: mqtt
        topic: "zigbee2mqtt/Playroom Cabinet Lights Remote/action"
        payload: "brightness_move_down"
        id: brightness_down
      - trigger: mqtt
        topic: "zigbee2mqtt/Playroom Cabinet Lights Remote/action"
        payload: "brightness_stop"
        id: brightness_stop
    actions:
      - choose:
          # Turn on light
          - conditions:
              - condition: trigger
                id: button_on
            sequence:
              - action: light.turn_on
                target:
                  entity_id:
                    - light.playroom_cabinet_lights
                data:
                  brightness_pct: 100

          # Turn off light
          - conditions:
              - condition: trigger
                id: button_off
            sequence:
              - action: light.turn_off
                target:
                  entity_id:
                    - light.playroom_cabinet_lights

          # Brightness up (hold top button)
          - conditions:
              - condition: trigger
                id: brightness_up
            sequence:
              - action: script.ramp_light_brightness
                data:
                  entity_id: light.playroom_cabinet_lights
                  reference_light: light.playroom_cabinet_lights
                  direction: up

          # Brightness down (hold bottom button)
          - conditions:
              - condition: trigger
                id: brightness_down
            sequence:
              - action: script.ramp_light_brightness
                data:
                  entity_id: light.playroom_cabinet_lights
                  reference_light: light.playroom_cabinet_lights
                  direction: down

          # Stop ramping (button released). script.ramp_light_brightness
          # is called directly above, which is a synchronous/blocking
          # call -- whether cancelling *this* automation (mode: restart)
          # also stops the still-running *script* isn't clearly
          # documented, so stop it explicitly rather than relying on
          # that propagating.
          - conditions:
              - condition: trigger
                id: brightness_stop
            sequence:
              - action: script.turn_off
                target:
                  entity_id: script.ramp_light_brightness
  - alias: Turn On Playroom Cabinet Lights When A Door Opens
    description: ''
    triggers:
    - trigger: door.opened
      target:
        entity_id:
        - binary_sensor.left_playroom_cabinet_door_sensor_contact
        - binary_sensor.middle_playroom_cabinet_door_sensor_contact
        - binary_sensor.right_playroom_cabinet_door_sensor_contact
      options:
        for: 00:00:00
        behavior: first
    conditions: []
    actions:
    - action: light.turn_on
      metadata: {}
      target:
        entity_id: light.playroom_cabinet_lights
      data:
        transition: 2
        brightness_pct: 100
    mode: single
  - alias: Turn Off Playroom Cabinet Lights When All Doors Close
    description: ''
    triggers:
    - trigger: door.closed
      target:
        entity_id:
        - binary_sensor.left_playroom_cabinet_door_sensor_contact
        - binary_sensor.middle_playroom_cabinet_door_sensor_contact
        - binary_sensor.right_playroom_cabinet_door_sensor_contact
      options:
        for:
          hours: 0
          minutes: 0
          seconds: 30
        behavior: all
    conditions: []
    actions:
    - action: light.turn_off
      metadata: {}
      target:
        entity_id: light.playroom_cabinet_lights
      data:
        transition: 3
    mode: single
