# This package binds Aidan's Fan Lights Remote (an IKEA Styrbar) to
# Aidan's 6 fan lights. Shared color-cycle/brightness-ramp logic lives
# in packages/lighting_control.yaml -- see that file for what each
# script expects.
#
# Here are how the button events are processed:
# Push Up           - Turn light on
# Push Down         - Turn lights off
# Hold Up           - Turn up the brightness to a max of 100%
# Hold Down         - Turn down the brightness to a min of 3%
# Push Right / Left - Cycle through RGB and White (warm, cool, bright, daylight) colors
#
# To bind a new IKEA Styrbar remote: copy this file's trigger/choose
# structure (same MQTT payloads: "on"/"off"/"brightness_move_up"/
# "brightness_move_down"/"brightness_stop"/"arrow_left_click"/
# "arrow_right_click"), swap in the new remote's own MQTT topic
# ("zigbee2mqtt/<friendly name>/action" -- find the friendly name in
# the Z2M frontend after pairing) and its own target/reference light(s),
# and call the same shared scripts.

automation:
  - alias: Aidan's Fan Light Control
    description: Control RGB light with Styrbar remote
    mode: restart
    triggers:
      - trigger: mqtt
        topic: "zigbee2mqtt/Aidan's Fan Lights Remote/action"
        payload: "on"
        id: button_on
      - trigger: mqtt
        topic: "zigbee2mqtt/Aidan's Fan Lights Remote/action"
        payload: "off"
        id: button_off
      - trigger: mqtt
        topic: "zigbee2mqtt/Aidan's Fan Lights Remote/action"
        payload: "brightness_move_up"
        id: brightness_up
      - trigger: mqtt
        topic: "zigbee2mqtt/Aidan's Fan Lights Remote/action"
        payload: "brightness_move_down"
        id: brightness_down
      - trigger: mqtt
        topic: "zigbee2mqtt/Aidan's Fan Lights Remote/action"
        payload: "brightness_stop"
        id: brightness_stop
      - trigger: mqtt
        topic: "zigbee2mqtt/Aidan's Fan Lights Remote/action"
        payload: "arrow_left_click"
        id: color_left
      - trigger: mqtt
        topic: "zigbee2mqtt/Aidan's Fan Lights Remote/action"
        payload: "arrow_right_click"
        id: color_right
    actions:
      - choose:
          # Turn on light
          - conditions:
              - condition: trigger
                id: button_on
            sequence:
              - action: light.turn_on
                target:
                  entity_id:
                    - light.ash_s_fan_light_1
                    - light.ash_s_fan_light_2
                    - light.ash_s_fan_light_3
                    - light.ash_s_fan_light_4
                    - light.ash_s_fan_light_5
                    - light.ash_s_fan_light_6
                data:
                  brightness_pct: 100

          # Turn off light
          - conditions:
              - condition: trigger
                id: button_off
            sequence:
              - action: light.turn_off
                target:
                  entity_id:
                    - light.ash_s_fan_light_1
                    - light.ash_s_fan_light_2
                    - light.ash_s_fan_light_3
                    - light.ash_s_fan_light_4
                    - light.ash_s_fan_light_5
                    - light.ash_s_fan_light_6

          # Brightness up (hold top button)
          - conditions:
              - condition: trigger
                id: brightness_up
            sequence:
              - action: script.ramp_light_brightness
                data:
                  entity_id:
                    - light.ash_s_fan_light_1
                    - light.ash_s_fan_light_2
                    - light.ash_s_fan_light_3
                    - light.ash_s_fan_light_4
                    - light.ash_s_fan_light_5
                    - light.ash_s_fan_light_6
                  reference_light: light.ash_s_fan_light_1
                  direction: up

          # Brightness down (hold bottom button)
          - conditions:
              - condition: trigger
                id: brightness_down
            sequence:
              - action: script.ramp_light_brightness
                data:
                  entity_id:
                    - light.ash_s_fan_light_1
                    - light.ash_s_fan_light_2
                    - light.ash_s_fan_light_3
                    - light.ash_s_fan_light_4
                    - light.ash_s_fan_light_5
                    - light.ash_s_fan_light_6
                  reference_light: light.ash_s_fan_light_1
                  direction: down

          # Stop ramping (button released). script.ramp_light_brightness
          # is called directly above, which is a synchronous/blocking
          # call -- whether cancelling *this* automation (mode: restart)
          # also stops the still-running *script* isn't clearly
          # documented, so stop it explicitly rather than relying on
          # that propagating.
          - conditions:
              - condition: trigger
                id: brightness_stop
            sequence:
              - action: script.turn_off
                target:
                  entity_id: script.ramp_light_brightness

          # Cycle color forward (right arrow)
          - conditions:
              - condition: trigger
                id: color_right
            sequence:
              - action: script.cycle_light_color
                data:
                  entity_id:
                    - light.ash_s_fan_light_1
                    - light.ash_s_fan_light_2
                    - light.ash_s_fan_light_3
                    - light.ash_s_fan_light_4
                    - light.ash_s_fan_light_5
                    - light.ash_s_fan_light_6
                  reference_light: light.ash_s_fan_light_1
                  direction: forward

          # Cycle color backward (left arrow)
          - conditions:
              - condition: trigger
                id: color_left
            sequence:
              - action: script.cycle_light_color
                data:
                  entity_id:
                    - light.ash_s_fan_light_1
                    - light.ash_s_fan_light_2
                    - light.ash_s_fan_light_3
                    - light.ash_s_fan_light_4
                    - light.ash_s_fan_light_5
                    - light.ash_s_fan_light_6
                  reference_light: light.ash_s_fan_light_1
                  direction: backward
