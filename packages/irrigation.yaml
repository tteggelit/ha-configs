  - id: irrigation_quorum_fault_front
    alias: "Irrigation — Front Garden Quorum Fault Alert"
    triggers:
      - trigger: state
        entity_id: sensor.front_garden_quorum
        to: "fault"
        for:
          minutes: 5
    actions:
      - repeat:
          for_each: "{{ state_attr('sensor.irrigation_notify_targets_resolved', 'targets') }}"
          sequence:
            - service: notify.send_message
              target:
                entity_id: "{{ repeat.item }}"
              data:
                title: "⚠️ Irrigation Sensor Fault"
                message: >
                  Front Garden has insufficient sensors online.
                  Valid: {{ state_attr('sensor.front_garden_quorum', 'valid_sensors') }}
                  of {{ state_attr('sensor.front_garden_quorum', 'total_sensors') }}
