  # ===========================================================================
  # IRRIGATION PAUSE — Set expiry when pause_days changes
  # ===========================================================================

  - id: irrigation_pause_set
    alias: "Irrigation — Set Pause Expiry"
    triggers:
      - trigger: state
        entity_id: input_number.irrigation_pause_days
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ states('input_number.irrigation_pause_days') | int(0) > 0 }}
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.irrigation_pause_until
                data:
                  datetime: >
                    {{ (now() + timedelta(
                        days=states('input_number.irrigation_pause_days') | int(1)
                      )).strftime('%Y-%m-%d %H:%M:%S') }}
              - service: system_log.write
                data:
                  message: >
                    Irrigation paused for
                    {{ states('input_number.irrigation_pause_days') | int }} day(s).
                    Resumes after
                    {{ states('input_datetime.irrigation_pause_until') }}.
                  level: info
          - conditions:
              - condition: template
                value_template: >
                  {{ states('input_number.irrigation_pause_days') | int(0) == 0 }}
            sequence:
              - service: system_log.write
                data:
                  message: "Irrigation pause cleared — normal scheduling resumed."
                  level: info
    mode: single

  # ===========================================================================
  # IRRIGATION PAUSE — Auto-expire
  # ===========================================================================

  - id: irrigation_pause_expire
    alias: "Irrigation — Auto-Expire Pause"
    triggers:
      - trigger: time_pattern
        minutes: "/30"
    conditions:
      - condition: template
        value_template: >
          {{ states('input_number.irrigation_pause_days') | int(0) > 0
             and now() >= states('input_datetime.irrigation_pause_until')
                | as_datetime | as_local }}
    actions:
      - service: input_number.set_value
        target:
          entity_id: input_number.irrigation_pause_days
        data:
          value: 0
      - service: system_log.write
        data:
          message: "Irrigation pause expired — normal scheduling resumed."
          level: info
    mode: single

  # ===========================================================================
  # RAIN DELAY — Auto-set on significant rainfall forecast anywhere in next 24h
  #
  # Requires BOTH NWS and Met.no to independently find at least one hourly
  # forecast block within the next 24 hours showing >80% probability AND
  # >0.5" precipitation. This deliberately mirrors the conservative
  # "both sources must agree" philosophy used elsewhere (sensor.irrigation_rain_factor)
  # to avoid skipping watering based on one source's outlier prediction.
  #
  # Widened from an original 6-hour window: a 6h lookahead only caught rain
  # about to start imminently, missing scenarios like "heavy rain forecast
  # for this evening" when the automation runs in the early morning watering
  # window. A 24h window catches the whole remainder of the day.
  # ===========================================================================

  - id: irrigation_rain_delay_set
    alias: "Irrigation — Set Rain Delay After Significant Rain"
    triggers:
      - trigger: time_pattern
        hours: "/1"
    conditions:
      - condition: template
        value_template: >
          {{ state_attr('sensor.irrigation_nws_forecast_cache', 'imminent_heavy_rain_24h') == true
             and state_attr('sensor.irrigation_met_no_forecast_cache', 'imminent_heavy_rain_24h') == true }}
    actions:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.rain_delay_active
      - service: system_log.write
        data:
          message: >
            Rain delay activated — both NWS and Met.no forecast >80% / >0.5"
            within the next 24 hours. Irrigation suppressed for 24 hours.
          level: info
      - delay:
          hours: 24
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.rain_delay_active
      - service: system_log.write
        data:
          message: "Rain delay cleared — normal irrigation scheduling resumed."
          level: info
    mode: single
    max_exceeded: silent

  # ===========================================================================
  # ONE-TIME SCHEDULED RUNS
  #
  # Each automation fires at the datetime set in its corresponding helper.
  # After firing (whether watering ran or was blocked), the helper is reset
  # to 1970-01-01 00:00:00 — a sentinel "no scheduled run" value that HA
  # will not re-trigger on since it's in the past.
  #
  # These bypass normal gate conditions (season window, moisture urgency,
  # weather, pause) since a scheduled run is an intentional override.
  # The global run lock is still respected — if another zone is already
  # running when the scheduled time arrives, the run is skipped and the
  # helper is cleared; the user can reschedule if needed.
  #
  # Clearing a pending scheduled run from the dashboard: set the datetime
  # helper to any past date, or use the "Clear" button in the dashboard card.
  # ===========================================================================

  - id: irrigation_scheduled_run_back_garden
    alias: "Irrigation — Scheduled Run: Back Garden"
    description: >
      Fires the back vegetable garden irrigation script at the date/time set
      in input_datetime.back_garden_scheduled_run, then clears the helper.
      Bypasses seasonal, weather, and moisture gate conditions.
    triggers:
      - trigger: time
        at: input_datetime.back_garden_scheduled_run
    conditions:
      # Only act if the scheduled time is actually in the future (not the
      # sentinel 1970 value or a leftover past value from a previous run)
      - condition: template
        value_template: >
          {{ states('input_datetime.back_garden_scheduled_run') not in
             ['unknown','unavailable','']
             and as_datetime(states('input_datetime.back_garden_scheduled_run'))
                | as_local > (now() - timedelta(minutes=1)) }}
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.irrigation_running
                state: "on"
            sequence:
              - service: system_log.write
                data:
                  message: >
                    Scheduled run: Back Garden skipped — another zone is
                    already running. Reschedule if needed.
                  level: warning
        default:
          - service: system_log.write
            data:
              message: "Scheduled run: Back Garden starting."
              level: info
          - service: script.back_vegetable_garden_irrigation
            data: {}
      # Always clear the helper after attempting the run
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.back_garden_scheduled_run
        data:
          datetime: "1970-01-01 00:00:00"
    mode: single

  - id: irrigation_scheduled_run_side_garden
    alias: "Irrigation — Scheduled Run: Side Garden"
    description: >
      Fires the side vegetable garden irrigation script at the date/time set
      in input_datetime.side_garden_scheduled_run, then clears the helper.
      Bypasses seasonal, weather, and moisture gate conditions.
    triggers:
