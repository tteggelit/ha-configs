                    already running. Reschedule if needed.
                  level: warning
        default:
          - service: system_log.write
            data:
              message: "Scheduled run: Side Garden starting."
              level: info
          - service: script.side_vegetable_garden_irrigation
            data: {}
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.side_garden_scheduled_run
        data:
          datetime: "1970-01-01 00:00:00"
    mode: single

  - id: irrigation_scheduled_run_front_garden
    alias: "Irrigation — Scheduled Run: Front Garden"
    description: >
      Fires the front garden irrigation script at the date/time set in
      input_datetime.front_garden_scheduled_run, then clears the helper.
      Bypasses seasonal, weather, and moisture gate conditions.
    triggers:
      - trigger: time
        at: input_datetime.front_garden_scheduled_run
    conditions:
      - condition: template
        value_template: >
          {{ states('input_datetime.front_garden_scheduled_run') not in
             ['unknown','unavailable','']
             and as_datetime(states('input_datetime.front_garden_scheduled_run'))
                | as_local > (now() - timedelta(minutes=1)) }}
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.irrigation_running
                state: "on"
            sequence:
              - service: system_log.write
                data:
                  message: >
                    Scheduled run: Front Garden skipped — another zone is
                    already running. Reschedule if needed.
                  level: warning
        default:
          - service: system_log.write
            data:
              message: "Scheduled run: Front Garden starting."
              level: info
          - service: script.front_garden_irrigation
            data: {}
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.front_garden_scheduled_run
        data:
          datetime: "1970-01-01 00:00:00"
    mode: single

  # ===========================================================================
  # QUORUM FAULT NOTIFICATIONS
  #
  # Reads resolved notify targets from the template sensor attribute 'targets',
  # which returns a list of entity IDs based on input_select.irrigation_notify_device.
  # When "None" is selected the list is empty and no notifications fire.
  # ===========================================================================

  - id: irrigation_quorum_fault_back
    alias: "Irrigation — Back Garden Quorum Fault Alert"
    triggers:
      - trigger: state
        entity_id: sensor.back_garden_quorum
        to: "fault"
        for:
          minutes: 5
    actions:
      - repeat:
          for_each: "{{ state_attr('sensor.irrigation_notify_targets_resolved', 'targets') }}"
          sequence:
            - service: notify.send_message
              target:
                entity_id: "{{ repeat.item }}"
              data:
                title: "⚠️ Irrigation Sensor Fault"
                message: >
                  Back Vegetable Garden has insufficient sensors online.
                  Valid: {{ state_attr('sensor.back_garden_quorum', 'valid_sensors') }}
                  of {{ state_attr('sensor.back_garden_quorum', 'total_sensors') }}
                  (minimum 3 required).
                  Automatic watering suspended for this zone.
    mode: single

  - id: irrigation_quorum_fault_side
    alias: "Irrigation — Side Garden Quorum Fault Alert"
    triggers:
      - trigger: state
        entity_id: sensor.side_garden_quorum
