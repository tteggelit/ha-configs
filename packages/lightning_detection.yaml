# === LAST ALERT INPUTS ===
# These keep track of when the last alert was triggered
# for a given direction
input_datetime:
  lightning_detection_last_west_alert:
    name: "Lightning Detection Last West Alert"
    has_date: true
    has_time: true
  lightning_detection_last_northwest_alert:
    name: "Lightning Detection Last Northwest Alert"
    has_date: true
    has_time: true
  lightning_detection_last_southwest_alert:
    name: "Lightning Detection Last Southwest Alert"
    has_date: true
    has_time: true
  lightning_detection_last_home_alert:
    name: "Lightning Detection Last Home Alert"
    has_date: true
    has_time: true

# === ZONES ===
# These define the zones that are used on Lovelace dashboard
# map card
zone:
  # === WEST ===
  - name: "Des Moines, IA"
    latitude: 41.5909
    longitude: -93.6208
    radius: 180000  # 180 km
    icon: mdi:weather-lightning

  - name: "Quad Cities, IA"
    latitude: 41.5889
    longitude: -90.5467
    radius: 70000   # 70 km
    icon: mdi:weather-lightning

  - name: "Dixon, IL"
    latitude: 41.8594
    longitude: -89.5003
    radius: 40000   # 40 km
    icon: mdi:weather-lightning

  # === SOUTHWEST ===
  - name: "St. Louis, MO"
    latitude: 38.6270
    longitude: -90.1994
    radius: 180000  # 180 km
    icon: mdi:weather-lightning

  - name: "Springfield, IL"
    latitude: 39.7817
    longitude: -89.6501
    radius: 70000  # 70 km
    icon: mdi:weather-lightning

  - name: "Pontiac, IL"
    latitude: 40.8836
    longitude: -88.6456
    radius: 40000   # 40 km
    icon: mdi:weather-lightning

  # === NORTHWEST ===
  - name: "Minneapolis, MN"
    latitude: 44.9778
    longitude: -93.2650
    radius: 180000  # 180 km
    icon: mdi:weather-lightning

  - name: "La Crosse, WI"
    latitude: 43.8014
    longitude: -91.2384
    radius: 70000  # 70 km
    icon: mdi:weather-lightning

  - name: "Platteville, WI"
    latitude: 42.6908
    longitude: -90.4928
    radius: 70000  # 70 km
    icon: mdi:weather-lightning

  # === HOME (Optional, for reference) ===
  - name: "Oswego, IL"
    latitude: 41.9175
    longitude: -88.3058
    radius: 25000   # 25 km
    icon: mdi:home

automation:
  - alias: 'Thunderstorm Alert'
    description: >-
      Sends tiered alerts for approaching lightning, but only if the forecast
      shows a >50% chance of thunderstorms in the next 4 hours.
    triggers:
      # === WEST ===
      - trigger: numeric_state
        entity_id: sensor.des_moines_lightning_distance
        below: 180
        id: 'des_moines'
      - trigger: numeric_state
        entity_id: sensor.quad_cities_lightning_distance
        below: 70
        id: 'quad_cities'
      - trigger: numeric_state
        entity_id: sensor.dixon_lightning_distance
        below: 40
        id: 'dixon'

      # === SOUTHWEST ===
      - trigger: numeric_state
        entity_id: sensor.st_louis_lightning_distance
        below: 180
        id: 'st_louis'
      - trigger: numeric_state
        entity_id: sensor.springfield_lightning_distance
        below: 70
        id: 'springfield'
      - trigger: numeric_state
        entity_id: sensor.pontiac_lightning_distance
        below: 40
        id: 'pontiac'

      # === NORTHWEST ===
      - trigger: numeric_state
        entity_id: sensor.minneapolis_lightning_distance
        below: 180
        id: 'minneapolis'
      - trigger: numeric_state
        entity_id: sensor.la_crosse_lightning_distance
        below: 70
        id: 'la_crosse'
      - trigger: numeric_state
        entity_id: sensor.platteville_lightning_distance
        below: 70
        id: 'platteville'

      # === HOME ===
      - trigger: numeric_state
        entity_id: sensor.home_lightning_distance
        below: 25
        id: 'oswego'

    actions:
      # Step 1: Get the forecast
      - action: weather.get_forecasts
        target:
          entity_id: weather.openweathermap
        data:
          type: hourly
        response_variable: weather_response

      # Step 2: Check if thunderstorm is likely
      - variables:
          forecast: "{{ weather_response['weather.openweathermap']['forecast'] }}"
          storm_predicted: >
            {% set forecasted = false %}
            {% for period in forecast[:4] %}
              {% set precip_prob = (period.precipitation_probability | int(0)) %}
              {% set condition = (period.condition | lower) %}
              {% if precip_prob > 50 or ('thunder' in condition or 'storm' in condition or 'tstorm' in condition) %}
                {% set forecasted = true %}
              {% endif %}
            {% endfor %}
            {{ forecasted }}

      # Step 3: Send direction-specific alerts only if storm is predicted (except for home)
      - choose:

          # === WEST: Des Moines (Early) ===
          - conditions: "{{ trigger.id == 'des_moines' }}"
            sequence:
              - choose:
                - conditions: >
                    {{ storm_predicted and (
                      (as_timestamp(now()) - as_timestamp(states('input_datetime.lightning_detection_last_west_alert') | default(0))) > 3600
                    ) }}
                  sequence:
                    - action: notify.mobile_app_tis_iphone
                      data:
                        title: "Distant Storm Warning (Des Moines, IA)"
                        message: "Confirmed storm w/ lightning near Des Moines, IA, moving east. Estimated arrival in 4-6 hours. Time for meds!"
                        data:
                          push:
                            sound:
                              name: default
                              critical: 1
                              volume: 1
                    # Set the last triggered time
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.lightning_detection_last_west_alert
                      data:
                        time: "{{ now().strftime('%H:%M:%S') }}"
                    # Log the event
                    - action: logbook.log
                      data:
                        name: Thunderstorm Alert
                        message: "Storm detected near Des Moines, IA. Forecast confirmed."
                        entity_id: automation.thunderstorm_alert
                        domain: automation

          # === WEST: Quad Cities (Mid) ===
          - conditions: "{{ trigger.id == 'quad_cities' }}"
            sequence:
              - choose:
                - conditions: >
                    {{ storm_predicted and (
                      (as_timestamp(now()) - as_timestamp(states('input_datetime.lightning_detection_last_west_alert') | default(0))) > 3600
                    ) }}
                  sequence:
                    - action: notify.mobile_app_tis_iphone
                      data:
                        title: "Approaching Storm (Quad Cities, IA)"
                        message: "Confirmed storm w/ lightning near the Quad Cities, IA, moving east. Estimated arrival in 2-3 hours."
                        data:
                          push:
                            sound:
                              name: default
                              critical: 1
                              volume: 1
                    # Set the last triggered time
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.lightning_detection_last_west_alert
                      data:
                        time: "{{ now().strftime('%H:%M:%S') }}"
                    # Log the event
                    - action: logbook.log
                      data:
                        name: Thunderstorm Alert
                        message: "Storm detected near Quad Cities, IA. Forecast confirmed."
                        entity_id: automation.thunderstorm_alert
                        domain: automation

          # === WEST: Dixon (Nearby) ===
          - conditions: "{{ trigger.id == 'dixon' }}"
