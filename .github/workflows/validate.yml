name: Validate config

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: pip install "yamllint==1.38.0" pyyaml

      - name: yamllint
        run: |
          yamllint -c .yamllint.yaml \
            $(git ls-files '*.yaml' '*.yml' | grep -v '^www/')

      - name: HA-tag-aware YAML syntax check
        run: |
          python3 scripts/hooks/check_yaml_syntax.py \
            $(git ls-files '*.yaml' '*.yml' | grep -v '^www/')

      - name: secrets.yaml.example drift check
        run: |
          python3 scripts/hooks/check_secrets_drift.py \
            $(git ls-files '*.yaml' '*.yml' | grep -v '^www/')

      - name: Duplicate automation id / script key / scene id check
        run: |
          python3 scripts/hooks/check_duplicate_ids.py \
            $(git ls-files 'packages/*.yaml' 'automations.yaml')

      - name: Home Assistant config check
        uses: frenck/action-home-assistant@v1.4.1
        with:
          path: "."
          secrets: "./secrets.yaml.example"
          # No `version:` input on purpose: the action auto-detects it
          # from a committed .HA_VERSION file, which packages/config_repo_
          # sync.yaml keeps in sync with whatever the live host is
          # actually running (see that package for how). Until .HA_VERSION
          # has been committed at least once, this falls back to the
          # action's own default (latest stable).

      - name: Set up ESPHome secrets
        run: cp secrets.yaml.example esphome/secrets.yaml

      - name: ESPHome config check
        run: |
          pip install esphome
          for f in esphome/*.yaml; do
            esphome config "$f"
          done
