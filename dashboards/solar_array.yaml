                        + '</g>'
                        // Mid-sky drifting clouds — 2 clouds passing through
                        + '<g filter="url(#bc1d)">'
                        + driftCloud(  0, 200, 110, 44, '#dde8ee', 0.55, 55,  0)
                        + driftCloud(-80, 240,  85, 36, '#e4eef4', 0.45, 70, 18)
                        + '</g>'
                        + '</svg>';

                  } else if (w === 'cloudy') {
                    // driftCloud helper (same as partlycloudy)
                    const driftCloud = function(startX, cy, rx, ry, col, op, dur, begin) {
                      return '<g opacity="' + op + '">'
                           + '<animateTransform attributeName="transform" type="translate"'
                           + ' values="' + (startX - 550) + ',0; ' + (startX + 550) + ',0"'
                           + ' dur="' + dur + 's" begin="' + begin + 's" repeatCount="indefinite"/>'
                           + '<ellipse cx="200" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + col + '"/>'
                           + '<ellipse cx="' + (200 - rx*0.4) + '" cy="' + (cy + ry*0.35) + '" rx="' + Math.round(rx*0.7) + '" ry="' + Math.round(ry*0.75) + '" fill="' + col + '"/>'
                           + '<ellipse cx="' + (200 + rx*0.38) + '" cy="' + (cy + ry*0.28) + '" rx="' + Math.round(rx*0.6) + '" ry="' + Math.round(ry*0.7) + '" fill="' + col + '"/>'
                           + '</g>';
                    };
                    svg = '<svg width="100vw" height="100vh" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">'
                        + '<defs>'
                        + '<filter id="bc2"><feGaussianBlur stdDeviation="8"/></filter>'
                        + '<filter id="bc2d"><feGaussianBlur stdDeviation="5"/></filter>'
                        + '</defs>'
                        + '<rect x="0" y="0" width="400" height="400" fill="#7a8a9a" opacity="0.2"/>'
                        // Static overcast layer — lighter so sky gradient still shows through
                        + '<g filter="url(#bc2)">'
                        + cloud(-30,  40, 150, 80, '#c8d4de', 0.7,  18,  0)
                        + cloud(130,  20, 170, 85, '#d0dae2', 0.7,  22,  2)
                        + cloud(310,  35, 155, 75, '#c8d4de', 0.7,  16,  5)
                        + cloud(440,  50, 130, 65, '#cdd6df', 0.7,  20,  1)
                        + '</g>'
                        + '<g filter="url(#bc2)">'
                        + cloud( 20, 120, 170, 75, '#b8c6d2', 0.6,  25,  3)
                        + cloud(210, 105, 190, 80, '#c0ceda', 0.6,  20,  7)
                        + cloud(400, 115, 145, 68, '#b8c6d2', 0.6,  28,  6)
                        + '</g>'
                        + '<g filter="url(#bc2)">'
                        + cloud( 50, 200, 160, 70, '#aabac8', 0.45, 30,  4)
                        + cloud(240, 185, 180, 75, '#b2c2d0', 0.45, 24,  8)
                        + cloud(420, 195, 140, 65, '#aabac8', 0.45, 26,  2)
                        + '</g>'
                        // Mid-sky drifting clouds — 3 clouds, lower opacity so sky still shows
                        + '<g filter="url(#bc2d)">'
                        + driftCloud(  0, 235, 120, 48, '#c8d4dc', 0.45, 50,  0)
                        + driftCloud(-50, 270, 100, 42, '#ccd8e0', 0.38, 62, 15)
                        + driftCloud( 30, 255, 108, 44, '#c4d0d8', 0.42, 56, 34)
                        + '</g>'
                        + '</svg>';

                  } else if (w === 'drizzle') {
                    let drops = '';
                    for (let i = 0; i < 15; i++) {
                      drops += rainDrop((i*27+6)%400, 48, 14, (1.6+(i%4)*0.2).toFixed(2), (i*0.4).toFixed(2), '#b0cede', 0.9);
                    }
                    svg = '<svg width="100vw" height="100vh" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">'
                        + '<defs><filter id="bc3a"><feGaussianBlur stdDeviation="2"/></filter></defs>'
                        + '<rect x="0" y="0" width="400" height="400" fill="#9ab4c4" opacity="0.08"/>'
                        + '<g filter="url(#bc3a)">'
                        + cloud( 70, 35,  85, 35, '#9ab4c4', 0.65, 12, 0)
                        + cloud(220, 28, 115, 40, '#a4bcc8', 0.65, 12, 2)
                        + cloud(360, 38,  75, 32, '#9ab4c4', 0.6,  14, 4)
                        + '</g>'
                        + drops
                        + '</svg>';

                  } else if (w === 'rainy') {
                    let drops = '';
                    for (let i = 0; i < 38; i++) {
                      drops += rainDrop((i*11+4)%400, 52, 42, (0.65+(i%5)*0.07).toFixed(2), (i*0.14).toFixed(2), '#72aace', 1.9);
                    }
                    svg = '<svg width="100vw" height="100vh" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">'
                        + '<defs><filter id="bc3b"><feGaussianBlur stdDeviation="3"/></filter></defs>'
                        + '<rect x="0" y="0" width="400" height="400" fill="#7a9eb8" opacity="0.2"/>'
                        + '<g filter="url(#bc3b)">'
