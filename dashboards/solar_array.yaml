                               '#fff0aa', 2.5, 1.8, 0)
                        // Bolt 3: far right, thinnest, different rhythm
                        + bolt('320,60 308,100 318,100 300,148 312,148 290,205 304,205 278,265 294,265 272,320',
                               '#ffe566', 2, 2.9, 0)
                        + '</svg>';

                  } else if (w === 'windy') {
                    // Lines sweep entire screen: translate from -500 to +500 so they cross full width
                    const windLine = function(y, len, dur, begin, sw, op) {
                      return '<line x1="0" y1="' + y + '" x2="' + len + '" y2="' + y + '"'
                           + ' stroke="white" stroke-width="' + sw + '" stroke-linecap="round" opacity="0">'
                           + '<animate attributeName="opacity" values="0;' + op + ';' + op + ';0"'
                           + ' dur="' + dur + 's" begin="' + begin + 's" repeatCount="indefinite"'
                           + ' calcMode="spline" keySplines="0.2 0 0.8 1;0 0 1 1;0.2 0 0.8 1"/>'
                           + '<animateTransform attributeName="transform" type="translate"'
                           + ' values="-500,0; 500,0" dur="' + dur + 's" begin="' + begin + 's" repeatCount="indefinite"/>'
                           + '</line>';
                    };
                    const wd = [
                      [ 18, 220, 1.8, 0.0,  2.0, 0.55], [ 42, 160, 2.2, 0.5,  1.2, 0.4 ],
                      [ 66, 280, 1.6, 1.0,  2.5, 0.6 ], [ 90, 130, 2.5, 0.2,  1.0, 0.35],
                      [114, 200, 1.9, 1.2,  1.8, 0.5 ], [138, 250, 2.0, 0.7,  2.2, 0.55],
                      [162, 170, 2.3, 1.6,  1.4, 0.4 ], [186, 310, 1.7, 0.3,  2.8, 0.6 ],
                      [210, 150, 2.6, 0.9,  1.1, 0.35], [234, 210, 1.8, 1.4,  1.9, 0.5 ],
                      [258, 260, 2.1, 0.1,  2.3, 0.55], [282, 180, 2.4, 0.8,  1.5, 0.45],
                      [306, 330, 1.6, 1.9,  2.6, 0.6 ], [330, 140, 2.7, 0.6,  1.0, 0.35],
                      [354, 230, 1.9, 1.1,  2.0, 0.5 ], [378, 190, 2.2, 1.7,  1.7, 0.45],
                      [ 30, 245, 2.0, 2.2,  2.1, 0.5 ], [ 78, 175, 1.7, 1.3,  1.6, 0.4 ],
                      [126, 290, 1.5, 0.4,  2.4, 0.55], [174, 155, 2.3, 2.0,  1.3, 0.4 ],
                    ];
                    let lines = '';
                    for (let i = 0; i < wd.length; i++) {
                      lines += windLine(wd[i][0], wd[i][1], wd[i][2], wd[i][3], wd[i][4], wd[i][5]);
                    }
                    svg = '<svg width="100vw" height="100vh" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">' + lines + '</svg>';

                  } else if (w === 'snowy' || w === 'snowy-rainy') {
                    const flake = function(x, dur, begin, size) {
                      const drift = ((x % 5) - 2) * 8;
                      return '<g opacity="0">'
                           + '<animate attributeName="opacity" values="0;0.8;0.8;0" dur="' + dur + 's" begin="' + begin + 's" repeatCount="indefinite"'
                           + ' calcMode="spline" keySplines="0.2 0 0.8 1; 0 0 1 1; 0.2 0 0.8 1"/>'
                           + '<animateTransform attributeName="transform" type="translate"'
                           + ' values="' + x + ',-10; ' + (x+drift) + ',200; ' + (x+drift*1.5) + ',420"'
                           + ' dur="' + dur + 's" begin="' + begin + 's" repeatCount="indefinite"'
                           + ' calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>'
                           + '<text x="0" y="0" font-size="' + size + '" fill="white" text-anchor="middle">\u2744</text>'
                           + '</g>';
                    };
                    let flakes = '';
                    for (let i = 0; i < 30; i++) {
                      flakes += flake((i*14+10)%390, (3.5+(i%5)*0.5).toFixed(1), (i*0.35).toFixed(2), 10+(i%3)*5);
                    }
                    let mixRain = '';
                    if (w === 'snowy-rainy') {
                      for (let i = 0; i < 22; i++) {
                        mixRain += rainDrop((i*18+9)%400, 48, 30, (0.75+(i%4)*0.09).toFixed(2), (i*0.21).toFixed(2), '#90bcd4', 1.4);
                      }
                    }
                    svg = '<svg width="100vw" height="100vh" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">'
                        + '<defs><filter id="bc6"><feGaussianBlur stdDeviation="3"/></filter></defs>'
                        + '<rect x="0" y="0" width="400" height="400" fill="#b0c4d4" opacity="0.15"/>'
                        + '<g filter="url(#bc6)">'
                        + cloud(100, 40, 100, 40, '#c8d8e4', 0.85, 10, 0)
                        + cloud(280, 32, 140, 46, '#d0dce8', 0.85, 10, 0)
                        + '</g>'
                        + flakes
                        + mixRain
                        + '</svg>';

                  } else if (w === 'fog' || w === 'hail') {
                    const fogPatch = function(cx, cy, rx, ry, col, op, opLo, dur, begin, dx) {
                      return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + col + '" opacity="' + op + '">'
                           + '<animate attributeName="opacity" values="' + op + ';' + opLo.toFixed(2) + ';' + op + '"'
                           + ' dur="' + dur + 's" begin="' + begin + 's" repeatCount="indefinite"'
                           + ' calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>'
                           + '<animateTransform attributeName="transform" type="translate"'
                           + ' values="0,0; ' + dx + ',0; 0,0" dur="' + dur + 's" begin="' + begin + 's" repeatCount="indefinite"'
                           + ' calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>'
                           + '</ellipse>';
                    };
                    svg = '<svg width="100vw" height="100vh" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">'
                        + '<defs>'
                        + '<filter id="bc7a"><feGaussianBlur stdDeviation="8"/></filter>'
                        + '<filter id="bc7b"><feGaussianBlur stdDeviation="3"/></filter>'
                        + '</defs>'
                        // Very light base — barely visible
                        + '<rect x="0" y="0" width="400" height="400" fill="#c0ccd2" opacity="0.25"/>'
                        // Large banks: alternate warm-white (#f0eeea) and cool blue-grey (#b8ccd6)
                        // Wide opacity swing (0.65 -> 0.08) makes thick/thin areas very distinct
                        + '<g filter="url(#bc7a)">'
                        + fogPatch(200,  80, 260, 100, '#d4d0cc', 0.60, 0.08, 18,  0,  24)
                        + fogPatch( 50, 180, 220,  90, '#9ab0bc', 0.55, 0.07, 23,  5, -20)
                        + fogPatch(370, 130, 200,  85, '#d0ccc8', 0.58, 0.08, 15,  2,  28)
                        + fogPatch(180, 290, 250,  95, '#9eb4c0', 0.50, 0.06, 21,  9, -24)
                        + fogPatch( 15, 330, 180,  80, '#d2cecc', 0.55, 0.07, 26,  4,  18)
                        + fogPatch(390, 260, 195,  88, '#96acb8', 0.50, 0.06, 19,  7, -16)
                        + '</g>'
                        // Smaller patches: near-white wisps vs steely blue-grey holes
                        + '<g filter="url(#bc7b)">'
                        + fogPatch( 90, 100, 140,  58, '#d8d4d0', 0.65, 0.08, 12,  1,  16)
                        + fogPatch(290,  70, 125,  52, '#8eaab6', 0.48, 0.05, 14,  6, -22)
                        + fogPatch( 35, 240, 150,  62, '#d4d0cc', 0.62, 0.08, 16,  2,  26)
                        + fogPatch(340, 210, 135,  56, '#92aeba', 0.44, 0.05, 10,  8, -14)
                        + fogPatch(180, 160, 165,  68, '#dedad6', 0.65, 0.08, 13,  3,  20)
                        + fogPatch( 80, 350, 195,  74, '#90acb8', 0.45, 0.05, 20,  0, -18)
                        + fogPatch(355, 330, 165,  65, '#d6d2ce', 0.58, 0.07, 15,  5,  24)
                        + fogPatch(215, 245, 155,  64, '#96b0bc', 0.46, 0.05, 11,  7, -12)
                        + '</g>'
                        + '</svg>';
                  }

                  if (!svg) return '';
                  return '<div style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:15;overflow:hidden;">' + svg + '</div>';
                ]]]
          - type: horizontal-stack
            cards:
