  gap_card:
    color_type: blank-card
  divider_card:
    color_type: blank-card
    styles:
      height: 500px
  title_card:
    show_entity_picture: false
views:
  - type: panel
    cards:
      - type: vertical-stack
        card_mod:
          style: |
            ha-card {
              position: relative !important;
              overflow: visible !important;
              background: transparent !important;
              box-shadow: none !important;
              border-radius: 0 !important;
              padding: 0 !important;
            }
        cards:
          - type: custom:button-card
            entity: weather.klot
            show_icon: false
            show_name: false
            show_state: false
            card_mod:
              style: |
                ha-card {
                  position: fixed !important;
                  top: 0 !important;
                  left: 0 !important;
                  width: 100vw !important;
                  height: 100vh !important;
                  z-index: 0 !important;
                  overflow: hidden !important;
                  margin: 0 !important;
                  border-radius: 0 !important;
                  box-shadow: none !important;
                  pointer-events: none !important;
                }
                @keyframes sun_pulse {
                  0%,100% { filter: drop-shadow(0 0 8px #ffe066) drop-shadow(0 0 20px #ffcc00); }
                  50%     { filter: drop-shadow(0 0 18px #ffe066) drop-shadow(0 0 40px #ffcc00); }
                }
                @keyframes sun_rays_spin {
                  from { transform: rotate(0deg); }
                  to   { transform: rotate(360deg); }
                }
                @keyframes moon_glow {
                  0%,100% { filter: drop-shadow(0 0 6px #e8e8cc) drop-shadow(0 0 14px #ccccaa); }
                  50%     { filter: drop-shadow(0 0 12px #fffde8) drop-shadow(0 0 28px #ccccaa); }
                }
                @keyframes rain_drop {
                  0%   { transform: translateY(-10px) scaleY(0.8); opacity: 0; }
                  20%  { opacity: 1; }
                  100% { transform: translateY(80px) scaleY(1.1); opacity: 0; }
                }
                @keyframes cloud_drift {
                  0%,100% { transform: translateX(0px); }
                  50%     { transform: translateX(12px); }
                }
                @keyframes wind_lines {
                  0%   { transform: translateX(-20px); opacity: 0; }
                  30%  { opacity: 0.7; }
                  100% { transform: translateX(60px); opacity: 0; }
                }
                @keyframes snow_fall {
                  0%   { transform: translateY(-5px) translateX(0px); opacity: 0; }
                  20%  { opacity: 1; }
                  50%  { transform: translateY(40px) translateX(8px); }
                  100% { transform: translateY(85px) translateX(-5px); opacity: 0; }
                }
                @keyframes lightning_flash {
                  0%,89%,91%,93%,100% { opacity: 0; }
                  90%,92%             { opacity: 1; }
                }
                @keyframes card_bounce {
                  0%,100% { transform: scale(1); }
                  50%     { transform: scale(1.04); }
                }
                @keyframes fog_drift {
                  0%,100% { opacity: 0.4; transform: translateX(0px); }
                  50%     { opacity: 0.65; transform: translateX(15px); }
                }
            styles:
              card:
                - background: |
                    [[[
                      const elev = Number((states['sun.sun'] && states['sun.sun'].attributes.elevation) || 30);
                      if (elev > 30)  return 'linear-gradient(to bottom, #1a90d4 0%, #87ceeb 55%, #c9eeff 100%)';
                      if (elev > 10)  return 'linear-gradient(to bottom, #3a7bd5 0%, #8ec5fc 55%, #e0c3fc 100%)';
                      if (elev > 2)   return 'linear-gradient(to bottom, #f7971e 0%, #ffd200 45%, #ffe9a0 100%)';
                      if (elev > 0)   return 'linear-gradient(to bottom, #e55d87 0%, #f7971e 50%, #ffd200 100%)';
                      if (elev > -6)  return 'linear-gradient(to bottom, #c04848 0%, #480048 50%, #1a1a2e 100%)';
                      if (elev > -12) return 'linear-gradient(to bottom, #0f0c29 0%, #302b63 60%, #24243e 100%)';
                      return 'linear-gradient(to bottom, #04040f 0%, #0d1130 55%, #0d0d1a 100%)';
                    ]]]
            custom_fields:
              sun_body: |
                [[[
                  const elev = Number((states['sun.sun'] && states['sun.sun'].attributes.elevation) || 30);
                  const az   = Number((states['sun.sun'] && states['sun.sun'].attributes.azimuth)   || 180);
                  if (elev < -0.833) return '';
                  const leftPct = Math.min(93, Math.max(4, ((az - 70) / 220) * 89 + 4)).toFixed(1);
                  const topPct  = Math.max(2, Math.min(30, 30 - elev * 0.5)).toFixed(1);
                  const opacity = Math.min(1, Math.max(0.3, elev / 30)).toFixed(2);
                  return '<div style="position:absolute;left:' + leftPct + '%;top:' + topPct + '%;'
                       + 'transform:translate(-50%,-50%);pointer-events:none;z-index:10;">'
                       + '<svg width="128" height="128" viewBox="0 0 64 64" style="overflow:visible;opacity:' + opacity + ';">'
                       + '<g transform="rotate(0,32,32)">'
                       + '<animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="20s" repeatCount="indefinite"/>'
                       + '<line x1="32" y1="4"  x2="32" y2="14" stroke="#ffe066" stroke-width="2.5" stroke-linecap="round"/>'
                       + '<line x1="32" y1="50" x2="32" y2="60" stroke="#ffe066" stroke-width="2.5" stroke-linecap="round"/>'
                       + '<line x1="4"  y1="32" x2="14" y2="32" stroke="#ffe066" stroke-width="2.5" stroke-linecap="round"/>'
                       + '<line x1="50" y1="32" x2="60" y2="32" stroke="#ffe066" stroke-width="2.5" stroke-linecap="round"/>'
                       + '<line x1="11" y1="11" x2="18" y2="18" stroke="#ffe066" stroke-width="2" stroke-linecap="round"/>'
                       + '<line x1="46" y1="46" x2="53" y2="53" stroke="#ffe066" stroke-width="2" stroke-linecap="round"/>'
                       + '<line x1="53" y1="11" x2="46" y2="18" stroke="#ffe066" stroke-width="2" stroke-linecap="round"/>'
                       + '<line x1="18" y1="46" x2="11" y2="53" stroke="#ffe066" stroke-width="2" stroke-linecap="round"/>'
                       + '</g>'
                       + '<circle cx="32" cy="32" r="14" fill="url(#sunGrad)">'
                       + '<animate attributeName="r" values="14;15.5;14" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>'
                       + '</circle>'
                       + '<defs>'
                       + '<radialGradient id="sunGrad" cx="40%" cy="35%">'
                       + '<stop offset="0%"   stop-color="#fff9c4"/>'
                       + '<stop offset="50%"  stop-color="#ffe066"/>'
                       + '<stop offset="100%" stop-color="#ffaa00"/>'
                       + '</radialGradient>'
                       + '</defs>'
                       + '</svg></div>';
                ]]]
              moon_body: |
                [[[
                  const elev = Number((states['sun.sun'] && states['sun.sun'].attributes.elevation) || 30);
                  if (elev >= -0.833) return '';
                  const az     = Number((states['sun.sun'] && states['sun.sun'].attributes.azimuth) || 180);
                  const moonAz = (az + 180) % 360;
                  const leftPct = Math.min(92, Math.max(5, ((moonAz - 70) / 220) * 88 + 5)).toFixed(1);
                  const topPct  = Math.max(2, Math.min(25, 25 + elev * 0.5)).toFixed(1);
                  const phase   = states['sensor.moon_phase'] ? states['sensor.moon_phase'].state : 'full_moon';
                  const r = 27.5, cx = 32, cy = 32;

                  const moonGradDefs = '<defs><radialGradient id="moonGrad" cx="35%" cy="30%">'
                    + '<stop offset="0%"   stop-color="#fffde8"/>'
                    + '<stop offset="60%"  stop-color="#e8e4c0"/>'
                    + '<stop offset="100%" stop-color="#b8b090"/>'
                    + '</radialGradient></defs>';

                  const litCircle  = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="url(#moonGrad)"/>';
                  const darkCircle = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#2a2a3e"/>';

                  const clipCircle = function(id, path) {
                    return '<defs><clipPath id="' + id + '"><path d="' + path + '"/></clipPath></defs>'
                         + darkCircle
                         + '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="url(#moonGrad)" clip-path="url(#' + id + ')"/>';
                  };

                  let moonSVG = '';
                  if (phase === 'new_moon') {
                    moonSVG = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#1a1a2e" stroke="#444" stroke-width="1"/>'
                            + '<circle cx="' + (cx-4) + '" cy="' + (cy-6) + '" r="1" fill="white" opacity="0.6"/>'
                            + '<circle cx="' + (cx+8) + '" cy="' + (cy+3) + '" r="0.8" fill="white" opacity="0.5"/>';
                  } else if (phase === 'waxing_crescent') {
                    moonSVG = clipCircle('wax_cres', 'M' + cx + ',' + (cy-r) + ' A' + r + ',' + r + ' 0 1,1 ' + cx + ',' + (cy+r) + ' A' + (r*0.4) + ',' + r + ' 0 1,0 ' + cx + ',' + (cy-r) + ' Z');
                  } else if (phase === 'first_quarter') {
                    moonSVG = '<defs><clipPath id="fq"><rect x="' + cx + '" y="' + (cy-r) + '" width="' + r + '" height="' + (r*2) + '"/></clipPath></defs>'
                            + darkCircle + '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="url(#moonGrad)" clip-path="url(#fq)"/>';
                  } else if (phase === 'waxing_gibbous') {
                    moonSVG = clipCircle('wax_gib', 'M' + cx + ',' + (cy-r) + ' A' + r + ',' + r + ' 0 1,1 ' + cx + ',' + (cy+r) + ' A' + (r*0.4) + ',' + r + ' 0 1,1 ' + cx + ',' + (cy-r) + ' Z');
                  } else if (phase === 'full_moon') {
                    moonSVG = litCircle
                            + '<ellipse cx="' + (cx-5) + '" cy="' + (cy-6) + '" rx="6" ry="4" fill="#c8c0a0" opacity="0.35"/>'
                            + '<ellipse cx="' + (cx+7) + '" cy="' + (cy+5) + '" rx="5" ry="3" fill="#c8c0a0" opacity="0.25"/>';
                  } else if (phase === 'waning_gibbous') {
                    moonSVG = clipCircle('wan_gib', 'M' + cx + ',' + (cy-r) + ' A' + r + ',' + r + ' 0 1,0 ' + cx + ',' + (cy+r) + ' A' + (r*0.4) + ',' + r + ' 0 1,0 ' + cx + ',' + (cy-r) + ' Z');
                  } else if (phase === 'last_quarter') {
                    moonSVG = '<defs><clipPath id="lq"><rect x="' + (cx-r) + '" y="' + (cy-r) + '" width="' + r + '" height="' + (r*2) + '"/></clipPath></defs>'
                            + darkCircle + '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="url(#moonGrad)" clip-path="url(#lq)"/>';
                  } else if (phase === 'waning_crescent') {
                    moonSVG = clipCircle('wan_cres', 'M' + cx + ',' + (cy-r) + ' A' + r + ',' + r + ' 0 1,0 ' + cx + ',' + (cy+r) + ' A' + (r*0.4) + ',' + r + ' 0 1,1 ' + cx + ',' + (cy-r) + ' Z');
                  } else {
                    moonSVG = litCircle;
                  }

                  return '<div style="position:absolute;left:' + leftPct + '%;top:' + topPct + '%;'
                       + 'transform:translate(-50%,-50%);pointer-events:none;z-index:10;text-align:center;">'
                       + '<svg width="128" height="128" viewBox="0 0 64 64" style="overflow:visible;">'
                       + moonGradDefs
                       + '<animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>'
                       + moonSVG
                       + '</svg></div>';
                ]]]
              stars: |
                [[[
                  const elev = Number((states['sun.sun'] && states['sun.sun'].attributes.elevation) || 30);
                  if (elev > 5) return '';
                  const opacity = Math.min(1, Math.max(0, (-elev + 5) / 15)).toFixed(2);
                  const pts = [[8,12],[18,6],[32,9],[47,5],[60,14],[72,8],[85,11],[93,7],[12,28],[25,22],[55,19],[70,25],[88,20],[96,30],[5,45],[20,38],[38,35],[65,40],[80,35],[95,42],[15,55],[30,60],[50,52],[75,58],[90,55]];
                  let dots = '';
                  for (let i = 0; i < pts.length; i++) {
                    const x = pts[i][0], y = pts[i][1];
                    const r = (0.4 + (x * y % 7) * 0.1).toFixed(1);
                    const o = (0.5 + (x * y % 5) * 0.1).toFixed(1);
                    dots += '<circle cx="' + (x/100*400) + '" cy="' + (y/100*400) + '" r="' + r + '" fill="white" opacity="' + o + '"/>';
                  }
                  return '<div style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:1;opacity:' + opacity + ';">'
                       + '<svg width="100%" height="100%" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" style="position:absolute;top:0;left:0;width:100%;height:100%;">'
                       + dots + '</svg></div>';
                ]]]
              weather_overlay: |
                [[[
                  const _we = states['weather.klot'];
                  const w = (_we ? _we.state : (entity ? entity.state : '')) || 'sunny';
                  if (w === 'sunny' || w === 'clear-night' || w === 'exceptional') return '';

                  // cloudAnim: SMIL translateX oscillation, no backticks
                  const cloudAnim = function(dur, begin) {
                    const b = begin !== undefined ? begin : 0;
                    return '<animateTransform attributeName="transform" type="translate"'
                         + ' values="0,0; 12,0; 0,0" dur="' + dur + 's" begin="' + b + 's"'
                         + ' repeatCount="indefinite" calcMode="spline"'
                         + ' keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>';
                  };

                  // rainDrop: SMIL falling line, no backticks
                  const rainDrop = function(x, y0, len, dur, begin, color, sw) {
                    return '<line x1="' + x + '" y1="' + y0 + '" x2="' + (x-5) + '" y2="' + (y0+len) + '"'
                         + ' stroke="' + color + '" stroke-width="' + sw + '" stroke-linecap="round" opacity="0">'
                         + '<animate attributeName="opacity" values="0;0.8;0" dur="' + dur + 's" begin="' + begin + 's" repeatCount="indefinite"/>'
                         + '<animateTransform attributeName="transform" type="translate"'
                         + ' values="0,0; 0,400" dur="' + dur + 's" begin="' + begin + 's" repeatCount="indefinite" additive="sum"/>'
                         + '</line>';
                  };

                  // cloud helper: builds a puffed cloud shape from ellipses with animation
                  const cloud = function(cx, cy, rx, ry, fill, op, dur, begin) {
                    return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '"'
                         + ' fill="' + fill + '" opacity="' + op + '">'
                         + cloudAnim(dur, begin)
                         + '</ellipse>';
                  };

                  let svg = '';

                  if (w === 'partlycloudy') {
                    const az  = Number((states['sun.sun'] && states['sun.sun'].attributes.azimuth)   || 180);
                    const elv = Number((states['sun.sun'] && states['sun.sun'].attributes.elevation) || 30);
                    const sx  = Math.round(Math.min(93, Math.max(4,  ((az  - 70) / 220) * 89 + 4))  * 4);
                    const sy  = Math.round(Math.max(2,  Math.min(30, 30 - elv * 0.5)) * 4);
                    const c1x = sx + 110, c1y = sy + 10;
                    const c2x = sx > 200 ? 40 : 360, c2y = sy + 40;
                    // driftCloud: a cloud mass that sweeps slowly left-to-right across screen
                    // startX: initial x offset so clouds enter staggered; cy: vertical position
                    // rx/ry: size; dur: seconds for full crossing; begin: delay
                    const driftCloud = function(startX, cy, rx, ry, col, op, dur, begin) {
                      return '<g opacity="' + op + '">'
                           + '<animateTransform attributeName="transform" type="translate"'
                           + ' values="' + (startX - 550) + ',0; ' + (startX + 550) + ',0"'
                           + ' dur="' + dur + 's" begin="' + begin + 's" repeatCount="indefinite"/>'
                           + '<ellipse cx="200" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + col + '"/>'
                           + '<ellipse cx="' + (200 - rx*0.4) + '" cy="' + (cy + ry*0.35) + '" rx="' + Math.round(rx*0.7) + '" ry="' + Math.round(ry*0.75) + '" fill="' + col + '"/>'
                           + '<ellipse cx="' + (200 + rx*0.38) + '" cy="' + (cy + ry*0.28) + '" rx="' + Math.round(rx*0.6) + '" ry="' + Math.round(ry*0.7) + '" fill="' + col + '"/>'
                           + '</g>';
                    };
                    svg = '<svg width="100vw" height="100vh" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">'
                        + '<defs>'
                        + '<filter id="bc1"><feGaussianBlur stdDeviation="5"/></filter>'
                        + '<filter id="bc1d"><feGaussianBlur stdDeviation="4"/></filter>'
                        + '</defs>'
                        // Sun clouds (existing)
                        + '<g filter="url(#bc1)">'
                        + cloud(c1x,      c1y,      130, 55, '#e8eef2', 0.92, 14,  0)
                        + cloud(c1x - 50, c1y + 25, 105, 48, '#eef2f5', 0.94, 14,  0)
                        + cloud(c1x + 45, c1y + 15,  90, 42, '#e4eaee', 0.88, 14,  0)
                        + cloud(c1x - 15, c1y - 18,  75, 36, '#f0f4f7', 0.85, 14,  0)
