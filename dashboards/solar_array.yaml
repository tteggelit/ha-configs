button_card_templates:
  _sky_overlay_base:
    variables:
      weather_state: >
        [[[ return states['weather.klot'] ? states['weather.klot'].state :
        'sunny'; ]]]
      sun_elevation: >
        [[[ return states['sun.sun'] ?
        Number(states['sun.sun'].attributes.elevation) : 30; ]]]
      sun_azimuth: >
        [[[ return states['sun.sun'] ?
        Number(states['sun.sun'].attributes.azimuth) : 180; ]]]
      moon_phase: >
        [[[ return states['sensor.moon_phase'] ?
        states['sensor.moon_phase'].state : 'full_moon'; ]]]
      is_night: >
        [[[ return states['sun.sun'] ?
        Number(states['sun.sun'].attributes.elevation) < -0.833 : false; ]]]
      sky_gradient: |
        [[[
          const sun = states['sun.sun'];
          const elev = sun ? Number(sun.attributes.elevation || 30) : 30;
          if (elev > 30)  return 'linear-gradient(to bottom, #1a90d4 0%, #87ceeb 60%, #e0f4ff 100%)';
          if (elev > 10)  return 'linear-gradient(to bottom, #3a7bd5 0%, #8ec5fc 60%, #e0c3fc 100%)';
          if (elev > 0)   return 'linear-gradient(to bottom, #f7971e 0%, #ffd200 50%, #ffe9a0 100%)';
          if (elev > -6)  return 'linear-gradient(to bottom, #c04848 0%, #480048 50%, #1a1a2e 100%)';
          if (elev > -12) return 'linear-gradient(to bottom, #0f0c29 0%, #302b63 50%, #24243e 100%)';
          return 'linear-gradient(to bottom, #0d0d1a 0%, #1a1a40 60%, #0d0d1a 100%)';
        ]]]
      sun_left: |
        [[[
          const sun = states['sun.sun'];
          const az = sun ? Number(sun.attributes.azimuth || 180) : 180;
          const pct = Math.min(95, Math.max(5, ((az - 70) / 220) * 90 + 5));
          return pct.toFixed(1) + '%';
        ]]]
      sun_top: |
        [[[
          const sun = states['sun.sun'];
          const elev = sun ? Number(sun.attributes.elevation || 30) : 30;
          const pct = Math.max(10, Math.min(78, 75 - elev * 1.5));
          return pct.toFixed(1) + '%';
        ]]]
  mp1_panel:
    aspect_ratio: 333/501
    show_entity_picture: true
    show_icon: false
    show_state: true
    variables:
      outlier: |
        [[[ return states['sensor.mp1_array_outlier_threshold'].state; ]]]
      alert: >
        [[[ return variables.outlier == 0 ? false : entity.state <
        variables.outlier; ]]]
    styles:
      name:
        - font-weight: bold
      card:
        - '--keep-background': 'true'
        - border: |
            [[[ return variables.alert ? '2px solid red' : 'none'; ]]]
        - border-radius: 5%
        - position: relative
        - z-index: '1'
        - text-shadow: 0px 0px 5px black
        - padding: '-10%'
        - background-image: |
            [[[ return  `url("/local/images/solar_panel.jpeg")`; ]]]
        - background-size: cover
        - background-repeat: no-repeat
        - color: |
            [[[ return variables.alert ? 'red' : 'white'; ]]]
        - animation: >
            [[[ return variables.alert ? 'card_bounce 2s ease infinite' :
            'none'; ]]]
        - text-transform: uppercase
        - font-weight: bold
        - background-color: rgba(255,235,171,0.15)
        - filter: |
            [[[
              return "brightness("+Math.min(100*(Math.round(Number(entity.state)) / 460 + 0.2), 100) + "%)"
            ]]]
    state_display: |
      [[[
        return Math.round(Number(entity.state))+" W ("+Math.min(Math.round(100*(Number(entity.state) / 460)), 100) + "%)"
      ]]]
  mp2_panel:
