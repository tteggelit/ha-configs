                           + '</div>';
                    ]]]
              - type: custom:button-card
                entity: weather.klot
                show_icon: false
                show_name: false
                show_state: false
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(0,0,0,0.25) !important;
                      backdrop-filter: blur(6px) !important;
                      position: relative !important;
                      z-index: 1 !important;
                      border-radius: 8px !important;
                      margin: 4px !important;
                      overflow: hidden !important;
                      height: 80px !important;
                    }
                styles:
                  card:
                    - height: 80px
                    - padding: 0
                  custom_fields:
                    weather_bar:
                      - width: 100%
                      - height: 80px
                      - display: block
                custom_fields:
                  weather_bar: |
                    [[[
                      const s     = entity.state || '';
                      const attrs = entity.attributes || {};
                      const temp  = attrs.temperature != null ? Math.round(attrs.temperature) + '\u00b0F' : '\u2014';
                      const humid = attrs.humidity    != null ? Math.round(attrs.humidity)    + '%'  : '';
                      const words = s.replace(/-/g,' ').split(' ');
                      const label = words.map(function(w){ return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');

                      const icon = function(st) {
                        const w = (st||'').toLowerCase();
                        if (w.indexOf('thunder') >= 0 || w.indexOf('lightning') >= 0) return '\u26c8\ufe0f';
                        if (w === 'pouring' || w.indexOf('pouring') >= 0)             return '\ud83c\udf27\ufe0f';
                        if (w.indexOf('drizzle') >= 0)                                return '\ud83c\udf26\ufe0f';
                        if (w.indexOf('snowy-rainy') >= 0 || w.indexOf('sleet') >= 0) return '\ud83c\udf28\ufe0f';
                        if (w.indexOf('snowy') >= 0 || w.indexOf('snow') >= 0)        return '\u2744\ufe0f';
                        if (w.indexOf('fog') >= 0 || w.indexOf('haze') >= 0)          return '\ud83c\udf2b\ufe0f';
                        if (w.indexOf('wind') >= 0)                                   return '\ud83d\udca8';
                        if (w.indexOf('hail') >= 0)                                   return '\ud83c\udf29\ufe0f';
                        if (w.indexOf('rainy') >= 0)                                  return '\ud83c\udf27\ufe0f';
                        if (w.indexOf('partly') >= 0 || w.indexOf('mostly') >= 0)     return '\u26c5';
                        if (w.indexOf('cloudy') >= 0 || w.indexOf('overcast') >= 0)   return '\u2601\ufe0f';
                        if (w.indexOf('clear') >= 0 || w.indexOf('sunny') >= 0)       return '\u2600\ufe0f';
                        return '\ud83c\udf21\ufe0f';
                      };

                      const fcastSensor = states['sensor.owm_hourly_forecast'];
                      const forecast = (fcastSensor && fcastSensor.attributes && fcastSensor.attributes.forecast
                                       ? fcastSensor.attributes.forecast : []).slice(0, 8);

                      const fmtHour = function(dt) {
                        if (!dt) return '';
                        try {
                          const d = new Date(dt);
                          let h = d.getHours();
                          const ap = h >= 12 ? 'p' : 'a';
                          h = h % 12 || 12;
                          return h + ap;
                        } catch(e) { return ''; }
                      };

                      const SEP = '<div style="width:1px;background:rgba(255,255,255,0.15);align-self:stretch;margin:6px 0;"></div>';
                      let slots = '';
                      for (let i = 0; i < forecast.length; i++) {
                        const f     = forecast[i];
                        const ft    = f.temperature != null ? Math.round(f.temperature) + '\u00b0' : '\u2014';
                        const fi    = icon(f.condition || '');
                        const fh    = fmtHour(f.datetime);
                        const fp    = f.precipitation_probability != null
                                      ? '<div style="font-size:9px;color:#90caf9;margin-top:1px;">' + Math.round(f.precipitation_probability) + '%</div>'
                                      : '';
                        if (i > 0) slots += SEP;
                        slots += '<div style="display:flex;flex-direction:column;align-items:center;padding:0 6px;min-width:44px;gap:1px;">'
                               + '<div style="font-size:10px;opacity:0.7;white-space:nowrap;">' + fh + '</div>'
                               + '<div style="font-size:18px;line-height:1.2;">' + fi + '</div>'
                               + '<div style="font-size:11px;font-weight:600;">' + ft + '</div>'
                               + fp
                               + '</div>';
                      }

                      const middle = slots
                        ? '<div style="display:flex;align-items:center;">' + slots + '</div>'
                        : '<div style="font-size:11px;opacity:0.5;padding:0 12px;">No hourly forecast available</div>';

                      return '<div style="display:flex;align-items:center;height:80px;width:100%;min-width:0;flex:1;color:white;'
                           + 'text-shadow:0 1px 3px rgba(0,0,0,0.7);box-sizing:border-box;overflow:hidden;">'
